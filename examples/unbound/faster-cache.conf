# Drop into ${CONFIG_ROOT}/unbound/ (mounted at /etc/unbound/custom.conf.d),
# then: docker restart unbound
# Undo: delete the file and restart unbound again.
server:
    # refresh popular records before they expire
    prefetch: yes
    prefetch-key: yes
    # answer from stale cache (up to a day) while a fresh lookup runs
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800
    # don't re-resolve very short TTLs every few seconds
    cache-min-ttl: 300
    # more cache, still small for a 16 GB gaming PC
    msg-cache-size: 64m
    rrset-cache-size: 128m
